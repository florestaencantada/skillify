name: Build, Push and GitOps Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITOPS_REPO: florestaencantada/integration_onprem
  GITOPS_BRANCH: main
  MANIFEST_PATH: gitops/clusters/forest-dev/applications/skillify-app.yaml

jobs:
  # =========================================================================
  # ETAPA 1: Build da imagem Docker e Push para o GHCR
  # =========================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
      image_ref: ${{ steps.set_tag.outputs.ref }}

    steps:
      - name: 📥 Checkout do código da aplicação
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Definir Tag da Imagem (SHA Curto)
        id: set_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ref=${IMAGE_LOWER}:${TAG}" >> $GITHUB_OUTPUT

      - name: 📋 Metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🚀 Build e Push para o GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # ETAPA 2: Promoção GitOps (Atualiza manifesto no integration_onprem)
  # =========================================================================
  promote-gitops:
    name: 🔄 GitOps Update (Argo CD Sync)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: ✏️ Atualizar Imagem no Manifesto Kubernetes
        run: |
          cd gitops-repo
          echo "Atualizando ${{ env.MANIFEST_PATH }} para tag ${{ needs.build-and-push.outputs.image_tag }}"
          
          # Atualiza a tag no skillify-app.yaml
          sed -i -E "s|(image:\s*ghcr\.io/.*/skillrush-back:).*|\1${{ needs.build-and-push.outputs.image_tag }}|g" "${{ env.MANIFEST_PATH }}"

          echo "Diff gerado:"
          git diff "${{ env.MANIFEST_PATH }}"

      - name: 🚀 Commit e Push no Repositório GitOps
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "${{ env.MANIFEST_PATH }}"
          
          if git diff --staged --quiet; then
            echo "Nenhuma mudança na imagem, pulando commit."
            exit 0
          fi

          git commit -m "ci(skillrush): update image to ${{ needs.build-and-push.outputs.image_tag }}" \
                     -m "Disparado pelo commit ${{ github.sha }} por @${{ github.actor }}"
          
          git push origin ${{ env.GITOPS_BRANCH }}
