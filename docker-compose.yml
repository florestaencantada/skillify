services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: skillify-frontend:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    restart: unless-stopped

  frontend-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_PORT:-5173}:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
